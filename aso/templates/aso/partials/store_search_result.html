{% comment %}
One app as it shows in an App Store search, for the Store explainer's
before and after. label, app (name, subtitle, matches: the searches its
words target), tone.
{% endcomment %}
<figure class="min-w-0">
    <figcaption class="mb-1.5 text-xs font-medium {% if tone == 'after' %}text-emerald-300{% else %}text-slate-400{% endif %}">{{ label }}</figcaption>
    <div class="flex items-center gap-3 rounded-xl border {% if tone == 'after' %}border-emerald-400/30{% else %}border-white/10{% endif %} bg-slate-900 px-3 py-3">
        <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-[10px] bg-emerald-500 text-white" aria-hidden="true">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
        </span>
        <span class="min-w-0 flex-1">
            <span class="block truncate text-sm font-semibold text-slate-100">{{ app.name }}</span>
            <span class="block truncate text-xs text-slate-400">{{ app.subtitle }}</span>
        </span>
        <span class="shrink-0 rounded-full bg-white/10 px-3 py-1 text-xs font-semibold text-sky-300" aria-hidden="true">Get</span>
    </div>
    <p class="mt-2 text-2xs text-slate-400">Targets searches for</p>
    <ul class="mt-1 flex flex-wrap gap-1">{% for m in app.matches %}<li class="rounded-full px-2 py-0.5 text-2xs {% if tone == 'after' %}bg-emerald-500/10 text-emerald-200{% else %}bg-white/5 text-slate-300{% endif %}">{{ m }}</li>{% endfor %}</ul>
</figure>
