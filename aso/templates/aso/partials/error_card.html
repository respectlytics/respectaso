{% comment %}
One card for the error pages that sit in the app's shell (403, 404, the
expired page): what happened, what to do, and two ways on. "Go back" only
shows when there is a page to go back to.
{% endcomment %}
<div class="max-w-2xl mx-auto w-full py-12">
    <section class="card p-4">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">{{ code }}</p>
        <h1 class="page-title mt-1">{{ heading }}</h1>
        <p class="text-sm text-slate-300 mt-2">{{ message }}</p>
        <div class="flex items-center gap-2 mt-4">
            <a href="{% url 'aso:dashboard' %}" class="btn-primary">Back to Keywords</a>
            <button type="button" id="error-go-back" onclick="history.back()" class="btn-secondary hidden">Go back</button>
        </div>
    </section>
</div>
<script>
    if (window.history.length > 1) document.getElementById('error-go-back').classList.remove('hidden');
</script>
