{% comment %}
One card for the error pages that sit in the app's shell (403, 404, the
expired page): what happened, what to do, and two ways on. "Go back" only
shows when there is a page to go back to.
{% endcomment %}
<div class="max-w-2xl mx-auto w-full py-12">
    <section class="bg-[#1e293b] border border-white/10 rounded-xl p-6">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">{{ code }}</p>
        <h1 class="text-xl font-bold text-white mt-1">{{ heading }}</h1>
        <p class="text-sm text-slate-300 mt-2">{{ message }}</p>
        <div class="flex items-center gap-2 mt-5">
            <a href="{% url 'aso:dashboard' %}" class="px-4 py-2 text-xs font-medium rounded-lg border border-transparent bg-purple-600 hover:bg-purple-500 text-white transition-colors">Back to the Dashboard</a>
            <button type="button" id="error-go-back" onclick="history.back()" class="hidden px-4 py-2 text-xs font-medium rounded-lg border border-white/15 text-slate-300 hover:text-white hover:border-white/30 transition-colors">Go back</button>
        </div>
    </section>
</div>
<script>
    if (window.history.length > 1) document.getElementById('error-go-back').classList.remove('hidden');
</script>
