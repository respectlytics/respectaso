{% load static %}
<!-- Run queue, inside the activity panel in the top bar (aso/partials/_activity.html)
     on every page (hidden until there is something to show). Rendered entirely by
     static/js/run-queue.js from the aso:queue_status endpoint. -->
<section id="queue-section" class="hidden">

    <!-- A run finished while the user was looking at something else. -->
    <div id="queue-notice" class="hidden flex items-start gap-3 mb-4 rounded-lg border border-white/10 bg-slate-800/60 px-3 py-2.5">
        <p id="queue-notice-text" class="text-sm text-slate-200 flex-1 min-w-0"></p>
        <button type="button" id="queue-notice-action"
                class="shrink-0 text-xs px-2.5 py-1 rounded-full border border-purple-500/30 text-purple-300 hover:bg-purple-600/20 transition-colors">
            View results
        </button>
        <button type="button" id="queue-notice-dismiss" title="Dismiss this message"
                class="shrink-0 text-slate-400 hover:text-slate-300 transition-colors p-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>

    <!-- The run that is going, on every page, its own included; drawn like the
         job row (aso/partials/search_job_strip.html), which shows a running
         keyword search or country scan instead. -->
    <div id="queue-running" class="hidden mb-3 rounded-lg border border-white/5 bg-slate-800/50 px-3 py-2.5">
        <div class="flex items-center gap-3">
            <div class="animate-spin h-4 w-4 border-2 border-purple-500 border-t-transparent rounded-full shrink-0"></div>
            <div class="min-w-0 flex-1">
                <div class="flex items-center justify-between gap-3">
                    <div id="queue-running-name" class="flex min-w-0 items-center gap-1.5"></div>
                    <span class="flex shrink-0 items-center gap-3">
                        <span id="queue-running-pct" class="text-xs tabular-nums text-slate-400"></span>
                        <a id="queue-running-link" href="#" class="link text-xs font-medium">Open</a>
                    </span>
                </div>
                <p id="queue-running-detail" class="mt-0.5 truncate text-xs text-slate-400"></p>
                <div class="mt-1.5 h-1.5 w-full rounded-full bg-slate-700/50">
                    <div id="queue-running-fill" class="h-1.5 rounded-full bg-purple-500 transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- A cancelled run is still finishing its step, or a busy probe
         (run_queue.busy_probes) holds the Apple budget: the text says which.
         A ranking refresh never does: it pauses for the queue
         (aso/scheduler.py give_way). -->
    <p id="queue-winding-down" class="hidden text-sm text-slate-400 mb-4"></p>

    <!-- Up next -->
    <div id="queue-header" class="hidden flex items-center justify-between gap-3 mt-3 mb-2">
        <h2 class="section-label">
            Up next
            <span id="queue-count" class="ml-1 font-normal normal-case tracking-normal text-slate-500"></span>
        </h2>
        <button type="button" id="queue-clear-btn" class="link-danger text-xs">Clear queue</button>
    </div>
    <div id="queue-list" class="space-y-2"></div>
</section>
